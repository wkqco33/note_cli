name: Release for ppm

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Run Tests
        env:
          NOTE_CLI_API_KEY: ${{ secrets.API_KEY }}
          NOTE_CLI_SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          NOTE_CLI_API_KEY: ${{ secrets.API_KEY }}
          NOTE_CLI_SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          BINARY_NAME=ncli

          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="ncli.exe"
          fi

          # 크로스플랫폼 빌드 (ppm.json bin_name 과 일치하는 ncli 로 산출물명 고정)
          go build -ldflags="-s -w -X 'note_cli/config/buildinfo.APIKey=${NOTE_CLI_API_KEY}' -X 'note_cli/config/buildinfo.SecretKey=${NOTE_CLI_SECRET_KEY}' -X 'note_cli/config/buildinfo.Version=${GITHUB_REF_NAME}'" -o "$BINARY_NAME" main.go

          # 아카이브 생성 (ppm 자산 명명 규칙: {bin_name}_{os}_{arch}.{ext})
          if [ "${{ matrix.goos }}" = "windows" ]; then
            ARCHIVE="ncli_${{ matrix.goos }}_${{ matrix.goarch }}.zip"
            zip "$ARCHIVE" "$BINARY_NAME"
          else
            ARCHIVE="ncli_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"
            tar -czvf "$ARCHIVE" "$BINARY_NAME"
          fi

          # SHA-256 체크섬 생성 (PACKAGE_GUIDE 5.1: require_checksum 대응)
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.tar.gz
            *.tar.gz.sha256
            *.zip
            *.zip.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
